<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindred — Random Quote Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:"DM Sans",Arial,sans-serif}.page{min-height:100vh;background:#f8f7f4;color:#2f352f;display:flex;flex-direction:column;transition:.2s}.navbar{height:76px;padding:0 clamp(20px,7vw,100px);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eae8e1}.brand{font-size:20px;font-weight:700;letter-spacing:-.8px}.brand b{color:#78926e}.nav-actions{display:flex;gap:14px;align-items:center}.nav-actions button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:12px}.saved-link{display:flex;align-items:center;gap:7px}.count{background:#e8e9df;padding:3px 7px;border-radius:7px}.theme{width:35px;height:35px;border:1px solid #e6e4db!important;border-radius:50%}.hero{width:min(calc(100% - 32px),650px);margin:auto;padding:58px 0 32px;flex:1}.kicker{display:flex;align-items:center;justify-content:center;gap:12px;font-size:9px;letter-spacing:2px;color:#84927b;font-weight:700}.kicker span{width:26px;height:1px;background:#bac6b1}.hero h1{text-align:center;font:600 clamp(39px,7vw,61px)/1.13 "Playfair Display",Georgia,serif;letter-spacing:-1.5px;margin:23px 0 13px}.hero h1 em{color:#7d9574}.intro{text-align:center;color:#8a8c82;font-size:12px;margin:0 0 35px}.card,.saved-panel{background:#fff;border:1px solid #eae8e0;border-radius:17px;box-shadow:0 16px 45px #393c2d09;padding:26px 31px 17px}.card-top{display:flex;justify-content:space-between;align-items:center}.quote-icon{background:#eef1e9;color:#78916e;border-radius:13px;padding:12px;font-size:20px}.category{font-size:9px;font-weight:700;color:#71856b;background:#f0f3ec;padding:7px 11px;border-radius:25px}.quote{position:relative;padding:24px 5px 25px;text-align:center}.quote blockquote{font:500 clamp(24px,4vw,33px)/1.48 "Playfair Display",Georgia,serif;margin:4px 0 0;animation:fade .25s}@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}.author{display:flex;align-items:center;gap:10px;margin:0 4px 20px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8ecdf;color:#607858;font-size:10px;font-weight:700}.author strong,.author small{display:block}.author strong{font-size:11px}.author small{font-size:9px;color:#9b9c91;margin-top:4px}.rule{height:1px;background:#eeede8;flex:1;margin-left:12px}.divider{height:1px;background:#eeede8}.actions{display:flex;justify-content:space-between;padding-top:12px}.actions button{border:0;background:transparent;color:#777b70;display:flex;gap:7px;align-items:center;font-size:10px;cursor:pointer}.actions button:hover,.actions .saved{color:#79936e}.new-area{text-align:center;margin-top:24px}.new{background:#6e8765;color:white;border:0;border-radius:9px;padding:13px 22px;min-width:180px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 7px 17px #6e876526}.new span{font-size:16px;margin-left:8px}.new-area p{color:#a0a194;font-size:10px;margin:10px}.footnote{text-align:center;color:#a2a397;font-size:9px;margin-top:30px}.footnote span{color:#9bab91;margin:0 10px}footer{text-align:center;border-top:1px solid #eae8e1;padding:20px;font-size:10px;color:#a0a194}footer b{color:#7c9273}.saved-panel{padding:24px}.saved-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eeede8;padding-bottom:16px}.saved-head h2{font:600 25px "Playfair Display",Georgia,serif;margin:7px 0 0}.eyebrow{font-size:9px;letter-spacing:1.6px;color:#84927b;font-weight:700}.saved-item{display:flex;gap:13px;padding:16px 0;border-bottom:1px solid #f0efe9}.saved-item div{flex:1}.saved-item p{font:500 16px/1.45 "Playfair Display",Georgia,serif;margin:0 0 6px}.saved-item small{font-size:10px;color:#929488}.saved-item button{border:0;background:transparent;color:#78916e;cursor:pointer}.empty{text-align:center;padding:35px 5px;color:#819477}.empty p{font:500 18px "Playfair Display",Georgia,serif;color:#42483f}.empty small{font-size:10px;color:#96988d}.dark{background:#20241f;color:#eceee6}.dark .navbar, .dark footer{border-color:#363c34}.dark .card,.dark .saved-panel{background:#292e28;border-color:#3b4138;box-shadow:none}.dark .quote blockquote,.dark .saved-item p,.dark .empty p{color:#f0f0e9}.dark .category,.dark .quote-icon,.dark .avatar{background:#374233;color:#c4d5b7}.dark .author small,.dark .actions button,.dark .saved-item small,.dark .intro,.dark footer,.dark .footnote{color:#a9afa2}.dark .divider,.dark .rule,.dark .saved-head,.dark .saved-item{border-color:#3b4138}.dark .new{background:#8ca77f;color:#182017}.dark .count{background:#363c34}.dark .theme{border-color:#41463e!important}.dark .empty small{color:#aeb4a7}@media(max-width:520px){.navbar{padding:0 16px;height:66px}.hero{padding-top:43px}.hero h1{margin-top:20px}.intro{line-height:1.6;max-width:300px;margin:0 auto 28px}.card{padding:20px 17px 14px}.quote blockquote{font-size:24px}.kicker{font-size:8px;gap:8px}.kicker span{width:18px}}
</style></head>
<body><div class="page" id="page"><nav class="navbar"><div class="brand">✦ kindred<b>.</b></div><div class="nav-actions"><button class="saved-link" onclick="toggleSavedView()">♡ Saved <span class="count" id="count">0</span></button><button class="theme" onclick="toggleTheme()" id="theme" aria-label="Toggle theme">☾</button></div></nav>
<main class="hero"><div class="kicker"><span></span>A MOMENT OF INSPIRATION<span></span></div><h1>A little wisdom<br>goes a <em>long way.</em></h1><p class="intro">Pause for a breath. Find a thought worth carrying with you.</p><section id="content"></section><div id="newArea" class="new-area"><button class="new" onclick="nextQuote()">⟳ &nbsp; Inspire me <span>↗</span></button><p>Every click, a new perspective.</p></div><div class="footnote">✦ &nbsp; A collection of <span id="total">18</span> thoughtful words &nbsp; ✦</div></main><footer><b>kindred.</b> Made for the moments that matter.</footer></div>
<script>
const quotes=[
{text:'It always seems impossible until it’s done.',author:'Nelson Mandela',category:'Courage'},
{text:'The secret of getting ahead is getting started.',author:'Mark Twain',category:'Motivation'},
{text:'In the middle of difficulty lies opportunity.',author:'Albert Einstein',category:'Perspective'},
{text:'It is never too late to be what you might have been.',author:'George Eliot',category:'Growth'},
{text:'Great things are done by a series of small things brought together.',author:'Vincent van Gogh',category:'Progress'},
{text:'Happiness depends upon ourselves.',author:'Aristotle',category:'Happiness'},
{text:'You miss 100% of the shots you don’t take.',author:'Wayne Gretzky',category:'Courage'},
{text:'The future depends on what you do today.',author:'Mahatma Gandhi',category:'Action'},
{text:'Nothing will work unless you do.',author:'Maya Angelou',category:'Motivation'},
{text:'Believe you can and you’re halfway there.',author:'Theodore Roosevelt',category:'Confidence'},
{text:'Do what you can, with what you have, where you are.',author:'Theodore Roosevelt',category:'Action'},
{text:'Simplicity boils down to two steps: identify the essential. Eliminate the rest.',author:'Leo Babauta',category:'Focus'},
{text:'No act of kindness, no matter how small, is ever wasted.',author:'Aesop',category:'Kindness'},
{text:'The only way out is through.',author:'Robert Frost',category:'Resilience'},
{text:'Be yourself; everyone else is already taken.',author:'Oscar Wilde',category:'Self-belief'},
{text:'A journey of a thousand miles begins with a single step.',author:'Lao Tzu',category:'Beginnings'},
{text:'What we think, we become.',author:'Buddha',category:'Mindset'},
{text:'Act as if what you do makes a difference. It does.',author:'William James',category:'Purpose'}];
let idx=Math.floor(Math.random()*quotes.length),saved=[],savedView=false,dark=false;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.getElementById('count').textContent=saved.length;const root=document.getElementById('content');document.getElementById('newArea').style.display=savedView?'none':'block';document.getElementById('total').textContent=quotes.length;if(savedView){root.innerHTML=`<section class="saved-panel"><div class="saved-head"><div><div class="eyebrow">YOUR COLLECTION</div><h2>Saved quotes</h2></div><span class="category">${saved.length} saved</span></div>${saved.length?saved.map((q,i)=>`<article class="saved-item"><span>${String(i+1).padStart(2,'0')}</span><div><p>“${esc(q.text)}”</p><small>— ${esc(q.author)}</small></div><button onclick="removeSaved('${encodeURIComponent(q.text)}')">♥</button></article>`).join(''):'<div class="empty">♡<p>Your favourite quotes will live here.</p><small>Tap “Save quote” whenever a line speaks to you.</small></div>'}</section>`;return}const q=quotes[idx],isSaved=saved.some(x=>x.text===q.text);const initials=q.author.split(' ').map(x=>x[0]).slice(0,2).join('');root.innerHTML=`<section class="card"><div class="card-top"><span class="quote-icon">❝</span><span class="category">${esc(q.category)}</span></div><div class="quote"><blockquote>“${esc(q.text)}”</blockquote></div><div class="author"><span class="avatar">${esc(initials)}</span><div><strong>${esc(q.author)}</strong><small>Words to remember</small></div><span class="rule"></span></div><div class="divider"></div><div class="actions"><button class="${isSaved?'saved':''}" onclick="toggleSave()">♡ &nbsp; ${isSaved?'Saved':'Save quote'}</button><button onclick="copyQuote()">▢ &nbsp; Copy quote</button></div></section>`}
function nextQuote(){let n=idx;while(n===idx)n=Math.floor(Math.random()*quotes.length);idx=n;render()}
function toggleSave(){const q=quotes[idx];if(saved.some(x=>x.text===q.text))saved=saved.filter(x=>x.text!==q.text);else saved.push(q);render()}
function removeSaved(encoded){const t=decodeURIComponent(encoded);saved=saved.filter(x=>x.text!==t);render()}
function toggleSavedView(){savedView=!savedView;render()}
function toggleTheme(){dark=!dark;document.getElementById('page').classList.toggle('dark',dark);document.getElementById('theme').textContent=dark?'☀':'☾'}
async function copyQuote(){const q=quotes[idx],text=`“${q.text}” — ${q.author}`;try{await navigator.clipboard.writeText(text);alert('Quote copied to clipboard!')}catch{prompt('Copy your quote:',text)}}
render();
</script></body></html>
